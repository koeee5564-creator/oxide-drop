<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxide Drop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Шапка -->
        <header>
            <div class="logo">🔥 OXIDE DROP</div>
            <div class="header-right">
                <button class="icon-btn">🔊</button>
                <div class="balance-box">
                    🪙 <span id="coins">700</span>
                </div>
            </div>
        </header>

        <!-- Главная вкладка: Кейсы -->
        <main>
            <!-- Блок статистики -->
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-num">4 537</span>
                    <span class="stat-label">игроков</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num">7 852</span>
                    <span class="stat-label">кейсов открыто</span>
                </div>
            </div>

            <!-- Баннер заданий и бонусов -->
            <div class="bonus-banner">
                <div class="bonus-left">
                    <span class="bonus-icon">🎁</span>
                    <div>
                        <div class="bonus-title">Задания и бонусы</div>
                        <div class="bonus-desc">Доступно +650 монет за задания</div>
                    </div>
                </div>
                <div class="bonus-badge">2 ></div>
            </div>

            <!-- Секция: Батл пасс боксы -->
            <h2 class="section-title">БАТЛ ПАСС БОКСЫ</h2>
            <div class="battlepass-card">
                <div class="bp-tag">BATTLE PASS</div>
                <div class="bp-info">
                    <h3>МОРОЗНАЯ ЯРОСТЬ</h3>
                    <div class="bp-price-btn">🪙 350</div>
                </div>
            </div>

            <!-- Секция: Кейсы -->
            <h2 class="section-title">КЕЙСЫ</h2>
            <div class="cases-row">
                <div class="case-card-small">
                    <div class="case-badge-free">FREE</div>
                    <h3>Бомж кейс</h3>
                    <div class="case-loot-preview">📦</div>
                </div>
                <div class="case-card-small">
                    <h3>Оружейный кейс</h3>
                    <div class="case-loot-preview">🔫</div>
                </div>
            </div>
        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <button class="nav-btn active">📦 Кейсы</button>
            <button class="nav-btn" onclick="alert('Переход в Апгрейд')">⚡ Апгрейд</button>
            <button class="nav-btn" onclick="alert('Переход в Задания')">📋 Задания</button>
            <button class="nav-btn" onclick="alert('Переход в Инвентарь')">💼 Инвентарь</button>
            <button class="nav-btn" onclick="alert('Переход в Профиль')">👤 Профиль</button>
        </nav>
    </div>
</body>
</html>
